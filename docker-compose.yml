version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: eksporsiap_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: eksporsiap_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eksporsiap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      # Mount folder database agar semua file .sql (000-005) dieksekusi otomatis saat init db.
      # File .csv (seed_hs_code.csv & seed_compliance_checklist.csv) di dalam folder 
      # ini otomatis diabaikan oleh PostgreSQL karena bukan script .sql atau .sh.
      - ./database:/docker-entrypoint-initdb.d

volumes:
  db_data:
